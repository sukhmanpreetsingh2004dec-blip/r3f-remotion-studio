name: 🎬 Render 3D Videos

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    name: Render MP4s on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            chromium-browser \
            libgbm-dev \
            xvfb

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 📁 Create output directory
        run: mkdir -p out

      - name: 🌍 Render GlobeZoom (Pakistan Globe)
        run: |
          ./node_modules/.bin/remotion render GlobeZoom \
            --codec=h264 \
            --output=out/globe-zoom.mp4 \
            --log=verbose \
            --browser-executable=$(which chromium-browser)
        env:
          DISPLAY: ':99'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: 🌲 Render RussianForest (Drone Shot)
        run: |
          ./node_modules/.bin/remotion render RussianForest \
            --codec=h264 \
            --output=out/russian-forest.mp4 \
            --log=verbose \
            --browser-executable=$(which chromium-browser)
        env:
          DISPLAY: ':99'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: 🎞️ Concatenate both videos into final MP4
        run: |
          echo "file 'out/globe-zoom.mp4'" > out/concat.txt
          echo "file 'out/russian-forest.mp4'" >> out/concat.txt
          ffmpeg -f concat -safe 0 -i out/concat.txt -c copy out/final-output.mp4

      - name: ⬆️ Upload final video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: |
            out/globe-zoom.mp4
            out/russian-forest.mp4
            out/final-output.mp4
          retention-days: 14
          if-no-files-found: error
